name: Qt builds (Qt 5 Linux/macOS, Qt 6 Windows)
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    container: fedora:44
    strategy:
      matrix:
        include:
          - compiler: g++
            spec: linux-g++
          - compiler: clang++
            spec: linux-clang
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git python3 gcc-c++ clang lld make pkgconf-pkg-config qt5-qtbase-devel qt5-qttools-devel qtsingleapplication-qt5-devel sqlite-devel libxml2-devel
      - uses: actions/checkout@v4
      - name: Prepare miniaudio
        run: |
          python3 scripts/prepare-miniaudio.py --prefix "$RUNNER_TEMP/quitersslean-miniaudio"
          echo "MINIAUDIO_INCLUDE_DIR=$RUNNER_TEMP/quitersslean-miniaudio/include" >> "$GITHUB_ENV"
      - name: Build
        run: |
          mkdir _build
          cd _build
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            qmake-qt5 -spec ${{ matrix.spec }} ../app.pro CONFIG+=release CONFIG-=debug_and_release QMAKE_LFLAGS+=-fuse-ld=lld
          else
            qmake-qt5 -spec ${{ matrix.spec }} ../app.pro CONFIG+=release CONFIG-=debug_and_release
          fi
          make -j2

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-imageformats
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ntldd
      - name: Prepare external QtSingleApplication and build
        run: |
          export PKG_CONFIG_PATH="$(cygpath -m /ucrt64/lib/pkgconfig)"
          dep_work="$(cygpath -m "$RUNNER_TEMP/quitersslean-deps")"
          python3 scripts/prepare-qtsingleapplication.py --work-dir "$dep_work" --qmake qmake6 --make mingw32-make
          export QMAKEFEATURES="$dep_work/install/features"
          python3 scripts/prepare-miniaudio.py --prefix "$dep_work/miniaudio"
          export MINIAUDIO_INCLUDE_DIR="$dep_work/miniaudio/include"
          mkdir _build
          cd _build
          qmake6 ../app.pro QUITERSS_QT_MAJOR=6 CONFIG+=release CONFIG-=debug_and_release
          mingw32-make -j2
          mingw32-make install
          python3 -c 'import json; d=json.load(open("generated/project-build.json")); print("PROJECT_NAME="+d["name"]); print("PROJECT_EXECUTABLE="+d["executable"])' >> "$GITHUB_ENV"

      - name: Deploy with windeployqt
        run: |
          DEPLOY_DIR=release/target
          EXE="$DEPLOY_DIR/$PROJECT_EXECUTABLE.exe"

          cd _build
          # Deploy into the same folder that contains the executable
          # --release          → only release DLLs
          # --compiler-runtime → copy MinGW/UCRT runtime DLLs
          # --verbose 1        → useful log in the Actions output
          windeployqt6 \
            --release \
            --compiler-runtime \
            --no-opengl-sw \
            --verbose 1 \
            "$EXE"

          echo "=== Collecting MSYS2 runtime dependencies ==="

          find "$DEPLOY_DIR" \
            \( -iname '*.exe' -o -iname '*.dll' \) \
            -print0 |
          while IFS= read -r -d '' binary; do
            ntldd -R "$binary" 2>/dev/null || true
          done |
          awk '$2 == "=>" {
            name=$1
            path=$3
            gsub(/\\/, "/", path)

            if (tolower(path) ~ /\/ucrt64\/bin\//)
              print name
          }' |
          sort -fu |
          while IFS= read -r dll; do
            src="/ucrt64/bin/$dll"

            if [ -f "$src" ]; then
              if [ ! -f "$DEPLOY_DIR/$dll" ]; then
                cp "$src" "$DEPLOY_DIR/"
                echo "Copied $dll"
              fi
            else
              echo "WARNING: unresolved MSYS2 dependency: $dll"
            fi
          done

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-Windows-${{ github.sha }}
          path: _build/release/target/
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt@5 sqlite libxml2 pkgconf python
      - name: Prepare external QtSingleApplication and build
        run: |
          export PATH="$(brew --prefix qt@5)/bin:$PATH"
          export PKG_CONFIG_PATH="$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig"
          dep_work="$RUNNER_TEMP/quitersslean-deps"
          python3 scripts/prepare-qtsingleapplication.py --work-dir "$dep_work"
          export QMAKEFEATURES="$dep_work/install/features"
          python3 scripts/prepare-miniaudio.py --prefix "$dep_work/miniaudio"
          export MINIAUDIO_INCLUDE_DIR="$dep_work/miniaudio/include"
          mkdir _build
          cd _build
          qmake ../app.pro CONFIG+=release CONFIG-=debug_and_release
          make -j2
